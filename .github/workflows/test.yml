name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y gfortran liblapack-dev libblas-dev

      - name: Compile Fortran library
        run: |
          cd src/fortran
          gfortran -O3 -shared -fPIC -o libhamiltonian_3rd.so \
            ham2d_general.f90 ham2d_3rd.f90 -llapack -lblas
          cp libhamiltonian_3rd.so ../python/

      - name: Install Python dependencies
        run: pip install numpy matplotlib scipy joblib pytest

      - name: Run tests
        run: pytest
